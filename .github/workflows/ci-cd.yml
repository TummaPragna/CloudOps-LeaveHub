name: CloudOps LeaveHub CI/CD

on:
  push:
    branches:
      - main

jobs:

  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build Backend
        working-directory: backend/AuthService
        run: mvn clean package -DskipTests

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Packages
        working-directory: frontend
        run: npm install

      - name: Build React
        working-directory: frontend
        run: npm run build

  docker:
    needs:
      - backend
      - frontend

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Backend JAR
        working-directory: backend/AuthService
        run: mvn clean package -DskipTests

      - name: Build Backend Docker Image
        run: docker build -t tummapragna/leavehub-backend:latest backend/AuthService

      - name: Push Backend Docker Image
        run: docker push tummapragna/leavehub-backend:latest

      - name: Build Frontend Docker Image
        run: docker build -t tummapragna/leavehub-frontend:latest frontend

      - name: Push Frontend Docker Image
        run: docker push tummapragna/leavehub-frontend:latest